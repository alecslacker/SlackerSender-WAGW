    <style>
      /* ── Splash boot terminal (tampil sebelum JS siap, hilang saat React mount) ── */
      html,body{background:#050805;margin:0;height:100%}
      .wa-boot{
        position:fixed;inset:0;z-index:9999;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
        background:#050805;color:#4ade80;overflow:hidden;
        font-family:'JetBrains Mono',ui-monospace,monospace;
      }
      /* grid + vignette latar */
      .wa-boot::before{
        content:"";position:absolute;inset:0;pointer-events:none;
        background-image:
          linear-gradient(rgba(74,222,128,.055) 1px,transparent 1px),
          linear-gradient(90deg,rgba(74,222,128,.055) 1px,transparent 1px);
        background-size:38px 38px;
        -webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 25%,transparent 78%);
        mask-image:radial-gradient(ellipse at 50% 45%,#000 25%,transparent 78%);
      }
      /* scanline CRT */
      .wa-boot::after{
        content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
        background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);
        opacity:.5;
      }
      .boot-frame{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:20px;padding:0 20px;text-align:center}

      /* logo + glitch */
      .boot-logo{position:relative;width:96px;height:96px;display:grid;place-items:center}
      .boot-logo img{width:96px;height:96px;display:block;filter:drop-shadow(0 0 22px rgba(74,222,128,.5))}
      .boot-logo .glitch{position:absolute;inset:0;opacity:0;mix-blend-mode:screen}
      .boot-logo .glitch.g1{animation:boot-g1 2.4s steps(1) infinite}
      .boot-logo .glitch.g2{animation:boot-g2 2.4s steps(1) infinite}
      @keyframes boot-g1{
        0%,80%,100%{opacity:0;transform:none;clip-path:inset(0 0 0 0)}
        84%{opacity:.85;transform:translate(-5px,2px);clip-path:inset(18% 0 52% 0)}
        88%{opacity:.85;transform:translate(4px,-2px);clip-path:inset(58% 0 18% 0)}
        92%{opacity:0;transform:none}
      }
      @keyframes boot-g2{
        0%,80%,100%{opacity:0;transform:none;clip-path:inset(0 0 0 0)}
        85%{opacity:.8;transform:translate(5px,-1px);clip-path:inset(42% 0 36% 0);filter:hue-rotate(-35deg)}
        90%{opacity:.8;transform:translate(-4px,1px);clip-path:inset(8% 0 74% 0);filter:hue-rotate(25deg)}
        93%{opacity:0;transform:none}
      }

      .boot-title{
        margin:0;font-family:'VT323','JetBrains Mono',monospace;
        font-size:clamp(34px,8vw,56px);font-weight:400;letter-spacing:.1em;line-height:1;
        color:#4ade80;text-shadow:0 0 26px rgba(74,222,128,.55);
      }
      .boot-title .caret{display:inline-block;width:.6em;animation:boot-blink 1s steps(1) infinite}
      @keyframes boot-blink{50%{opacity:0}}

      .boot-tag{margin:0;font-size:11px;letter-spacing:.34em;color:#2fb35d;text-transform:uppercase}

      /* baris boot log */
      .boot-log{
        margin:0;padding:0;list-style:none;text-align:left;
        font-size:11.5px;line-height:1.85;color:#2fb35d;min-height:7.4em;width:min(340px,86vw);
      }
      .boot-log li{opacity:0;animation:boot-line .34s cubic-bezier(.2,.8,.2,1) forwards}
      .boot-log li b{color:#86efac;font-weight:700}
      .boot-log li .ok{color:#22ff88;font-weight:700;float:right}
      @keyframes boot-line{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:none}}
      .boot-log li:nth-child(1){animation-delay:.45s}
      .boot-log li:nth-child(2){animation-delay:1.15s}
      .boot-log li:nth-child(3){animation-delay:1.85s}
      .boot-log li:nth-child(4){animation-delay:2.55s}

      /* progress */
      .boot-bar{position:relative;width:min(340px,86vw);height:3px;background:#102b18;border-radius:99px;overflow:hidden}
      .boot-bar span{
        position:absolute;inset:0;transform-origin:left;border-radius:99px;
        background:linear-gradient(90deg,#15803d,#22ff88);
        box-shadow:0 0 12px rgba(74,222,128,.7);
        animation:boot-fill 4.1s cubic-bezier(.35,.85,.3,1) forwards;
      }
      @keyframes boot-fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      .boot-pct{margin:0;font-size:10.5px;letter-spacing:.22em;color:#2fb35d}

      /* pelepasan splash: pudar + sedikit menjauh */
      .wa-boot{transition:opacity .5s ease,transform .5s ease}
      .wa-boot.is-done{opacity:0;transform:scale(1.03);pointer-events:none}

      @media (prefers-reduced-motion:reduce){
        .boot-logo .glitch,.boot-title .caret{animation:none}
        .boot-log li{opacity:1;animation:none}
        .boot-bar span{animation:none;transform:scaleX(1)}
      }
    </style>
